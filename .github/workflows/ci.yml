name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Active LTS. Satisfies Next (>=20.9) and Vitest (^20 || ^22 || >=24),
          # and unlike Node 20 it is not end-of-life.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # No secrets are provided: the build must succeed without them, and the
      # evaluator benchmark is deliberately excluded because it makes live
      # API calls.
      - name: Build
        run: npm run build
